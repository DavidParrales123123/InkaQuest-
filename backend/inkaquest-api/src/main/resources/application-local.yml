# =============================================================================
# INKAQUEST API - Perfil LOCAL (desarrollo)
# -----------------------------------------------------------------------------
# Se activa con: mvn spring-boot:run -Dspring-boot.run.profiles=local
# o con la variable SPRING_PROFILES_ACTIVE=local
#
# Este archivo NO contiene secretos: todos los valores sensibles vienen de
# variables de entorno con valores por defecto solo para desarrollo local.
# =============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.nrfdifzechrjikrvzhdl.supabase.co:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

supabase:
  url: ${SUPABASE_URL:http://127.0.0.1:54321}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}

logging:
  level:
    com.inkaquest: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
